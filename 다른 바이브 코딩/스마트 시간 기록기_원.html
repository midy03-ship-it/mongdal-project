<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태블릿용 스마트 시간 기록기</title>
    <style>
        * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f4f7f6; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="date"] { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
        
        .time-input-box { display: flex; gap: 10px; }
        .time-display { flex: 2; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; background: #fff; text-align: center; cursor: pointer; }
        .time-display.active { border-color: #1a73e8; background: #e8f0fe; color: #174ea6; font-weight: bold; }
        .time-display.disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; }
        .now-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; background-color: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .now-btn:active { background-color: #5a6268; }

        .main-submit-btn { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .main-submit-btn:active { background-color: #1557b0; }
        .main-submit-btn.ongoing-mode { background-color: #28a745; }
        .main-submit-btn.ongoing-mode:active { background-color: #218838; }

        /* 구글 알람 스타일 통합 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 24px; width: 340px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; color: #5f6368; text-align: left; }
        
        /* 휠 피커 영역 */
        .alarm-picker { display: flex; justify-content: center; gap: 6px; align-items: center; height: 140px; margin-bottom: 16px; background: #f8f9fa; border-radius: 12px; border: 1px solid #e0e0e0; overflow: hidden; position: relative; }
        .alarm-picker::before { content: ''; position: absolute; top: 50%; left: 10px; right: 10px; height: 40px; transform: translateY(-50%); background: rgba(26, 115, 232, 0.08); border-top: 1px solid #1a73e8; border-bottom: 1px solid #1a73e8; pointer-events: none; z-index: 1; }

        .wheel-column { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; padding: 50px 0; scrollbar-width: none; }
        .wheel-column::-webkit-scrollbar { display: none; }
        
        .wheel-item { height: 40px; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #9aa0a6; scroll-snap-align: center; cursor: pointer; }
        .wheel-item.selected { color: #1a73e8; font-size: 20px; font-weight: bold; }
        .wheel-divider { font-size: 20px; font-weight: bold; color: #3c4043; }

        /* 구글 스타일 입력 전환 버튼 (키패드 토글) */
        .google-input-toggle { background: transparent; border: none; color: #1a73e8; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: auto; margin-bottom: 10px; }
        .google-input-toggle:hover { background: #f1f3f4; }

        /* 키패드 컨테이너 */
        .keypad-container { display: none; background: #f8f9fa; padding: 12px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #e0e0e0; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .keypad-display-box { display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 12px; }
        .keypad-display-box select, .keypad-display-box input { padding: 8px; font-size: 18px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; background: white; outline: none; }
        .keypad-display-box input.active-box { border-color: #1a73e8; background: #e8f0fe; color: #174ea6; font-weight: bold; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 220px; margin: 0 auto; }
        .num-btn { padding: 10px; font-size: 18px; font-weight: 500; background: white; border: 1px solid #dadce0; border-radius: 8px; cursor: pointer; color: #3c4043; }
        .num-btn:active { background: #e8f0fe; color: #1a73e8; }

        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btns button { padding: 8px 16px; font-size: 14px; font-weight: 600; border: none; border-radius: 20px; cursor: pointer; background: transparent; }
        .btn-cancel { color: #5f6368; }
        .btn-cancel:hover { background: #f1f3f4; }
        .btn-confirm { color: #1a73e8; }
        .btn-confirm:hover { background: #e8f0fe; }

        /* 리스트 스타일 */
        .summary-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-size: 18px; }
        .summary-box span { font-weight: bold; color: #1a73e8; }
        
        .history-list { margin-top: 20px; max-height: 220px; overflow-y: auto; border-top: 1px solid #ddd; padding-top: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #fff; border: 1px solid #eaeaea; border-radius: 8px; margin-bottom: 8px; font-size: 15px; }
        .history-info { display: flex; flex-direction: column; gap: 2px; }
        .history-time { font-weight: bold; color: #333; }
        .history-duration { font-size: 13px; color: #1a73e8; }
        .history-duration.ongoing { color: #dc3545; font-weight: bold; }
        
        .delete-btn { background: transparent; color: #adb5bd; border: none; font-size: 16px; cursor: pointer; padding: 5px; border-radius: 4px; }
        .delete-btn:hover { color: #dc3545; background: #fff5f5; }
    </style>
</head>
<body>

<div class="container">
    <h2>⏱️ 스마트 시간 기록기</h2>
    
    <div class="input-group">
        <label for="recordDate">1. 날짜 선택</label>
        <input type="date" id="recordDate">
    </div>

    <!-- 시작 시간 영역 -->
    <div class="input-group">
        <label id="startLabel">2. 시작 시간</label>
        <div class="time-input-box">
            <div id="startTimeDisplay" class="time-display" onclick="openModal('start')">시간 선택</div>
            <button id="startNowBtn" class="now-btn" onclick="setNow('start')">지금</button>
        </div>
    </div>

    <!-- 종료 시간 영역 -->
    <div class="input-group">
        <label id="endLabel">3. 종료 시간</label>
        <div class="time-input-box">
            <div id="endTimeDisplay" class="time-display" onclick="openModal('end')">미입력 가능</div>
            <button id="endNowBtn" class="now-btn" onclick="setNow('end')">지금</button>
        </div>
    </div>

    <button id="mainSubmitBtn" class="main-submit-btn" onclick="handleSubmit()">기록 추가하기</button>

    <div class="summary-box">
        선택한 날짜 누적 시간: <span id="dailyTotal">0시간 0분</span>
    </div>

    <div class="history-list" id="historyList"></div>
</div>

<!-- 구글 알람 스타일 통합 모달 -->
<div class="modal" id="timeModal">
    <div class="modal-content">
        <div class="modal-title" id="modalTitle">시간 설정</div>
        
        <button class="google-input-toggle" id="toggleModeBtn" onclick="toggleKeypadMode()" title="키패드로 직접 입력">⌨️</button>

        <!-- 휠 피커 영역 -->
        <div class="alarm-picker" id="wheelPickerArea">
            <div class="wheel-column" id="ampmWheel" onscroll="syncWheelToKeypad('ampm')">
                <div class="wheel-item" data-val="오전">오전</div>
                <div class="wheel-item" data-val="오후">오후</div>
            </div>
            <div class="wheel-column" id="hourWheel" onscroll="syncWheelToKeypad('hour')">
                <script>for(let i=1; i<=12; i++) document.write(`<div class="wheel-item" data-val="${i}">${i}</div>`);</script>
            </div>
            <div class="wheel-divider">:</div>
            <div class="wheel-column" id="minuteWheel" onscroll="syncWheelToKeypad('minute')">
                <script>for(let i=0; i<60; i++) { let m=String(i).padStart(2,'0'); document.write(`<div class="wheel-item" data-val="${m}">${m}</div>`); }</script>
            </div>
        </div>

        <!-- 키패드 직접 입력 영역 -->
        <div class="keypad-container" id="keypadArea">
            <div class="keypad-display-box">
                <select id="keypadAmpm" onchange="syncKeypadToWheel()">
                    <option value="오전">오전</option>
                    <option value="오후">오후</option>
                </select>
                <input type="text" id="keypadHour" placeholder="시" maxlength="2" style="width: 55px;" onclick="setActiveField('hour')" readonly>
                <span>:</span>
                <input type="text" id="keypadMinute" placeholder="분" maxlength="2" style="width: 55px;" onclick="setActiveField('minute')" readonly class="active-box">
            </div>
            <div class="numpad">
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn" onclick="pressNum('00')">00</button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn" onclick="pressNum('DEL')">⌫</button>
            </div>
        </div>

        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-confirm" onclick="confirmTime()">확인</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('recordDate').valueAsDate = new Date();
    let records = JSON.parse(localStorage.getItem('timeRecords')) || [];

    let activeTarget = null; 
    let startTimeValue = "";
    let endTimeValue = "";
    let isKeypadOpen = false;
    let activeField = 'minute';

    const startTimeDisplay = document.getElementById('startTimeDisplay');
    const endTimeDisplay = document.getElementById('endTimeDisplay');
    const startNowBtn = document.getElementById('startNowBtn');
    const startLabel = document.getElementById('startLabel');
    const endLabel = document.getElementById('endLabel');
    const mainSubmitBtn = document.getElementById('mainSubmitBtn');
    
    const timeModal = document.getElementById('timeModal');
    const modalTitle = document.getElementById('modalTitle');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const wheelPickerArea = document.getElementById('wheelPickerArea');
    const keypadArea = document.getElementById('keypadArea');
    
    const keypadAmpm = document.getElementById('keypadAmpm');
    const keypadHour = document.getElementById('keypadHour');
    const keypadMinute = document.getElementById('keypadMinute');

    function openModal(target) {
        if (target === 'start' && getOngoingRecord()) return;
        activeTarget = target;
        modalTitle.innerText = target === 'start' ? '시작 시간 설정' : '종료 시간 설정';
        
        isKeypadOpen = false;
        wheelPickerArea.style.display = 'flex';
        keypadArea.style.display = 'none';
        toggleModeBtn.innerHTML = '⌨️';
        toggleModeBtn.title = '키패드로 직접 입력';

        timeModal.style.display = 'flex';

        const now = new Date();
        let h = now.getHours();
        let m = now.getMinutes();
        let isPm = h >= 12;
        if (h === 0) h = 12;
        else if (h > 12) h -= 12;

        setWheelPosition('ampmWheel', isPm ? '오후' : '오전');
        setWheelPosition('hourWheel', String(h));
        setWheelPosition('minuteWheel', String(m).padStart(2, '0'));
        
        keypadAmpm.value = isPm ? '오후' : '오전';
        keypadHour.value = String(h);
        keypadMinute.value = String(m).padStart(2, '0');
        setActiveField('minute');
    }

    function closeModal() {
        timeModal.style.display = 'none';
    }

    function toggleKeypadMode() {
        isKeypadOpen = !isKeypadOpen;
        if (isKeypadOpen) {
            wheelPickerArea.style.display = 'none';
            keypadArea.style.display = 'block';
            toggleModeBtn.innerHTML = '🕒';
            toggleModeBtn.title = '휠로 선택';
        } else {
            wheelPickerArea.style.display = 'flex';
            keypadArea.style.display = 'none';
            toggleModeBtn.innerHTML = '⌨️';
            toggleModeBtn.title = '키패드로 직접 입력';
            syncKeypadToWheel();
        }
    }

    function setActiveField(field) {
        activeField = field;
        if (field === 'hour') {
            keypadHour.classList.add('active-box');
            keypadMinute.classList.remove('active-box');
        } else {
            keypadMinute.classList.add('active-box');
            keypadHour.classList.remove('active-box');
        }
    }

    function syncWheelToKeypad(wheelId) {
        const val = getSelectedWheelValue(wheelId);
        if (wheelId === 'ampm') keypadAmpm.value = val;
        else if (wheelId === 'hour') keypadHour.value = val;
        else if (wheelId === 'minute') keypadMinute.value = val;
        updateWheelHighlight(wheelId);
    }

    function syncKeypadToWheel() {
        setWheelPosition('ampmWheel', keypadAmpm.value);
        setWheelPosition('hourWheel', keypadHour.value || '1');
        setWheelPosition('minuteWheel', keypadMinute.value.padStart(2, '0') || '00');
    }

    function pressNum(val) {
        let target = activeField === 'hour' ? keypadHour : keypadMinute;
        let max = activeField === 'hour' ? 12 : 59;

        if (val === 'DEL') {
            target.value = target.value.slice(0, -1);
        } else {
            let newVal = target.value + val;
            if (parseInt(newVal) <= max || newVal === "") {
                target.value = newVal;
            }
        }
        syncKeypadToWheel();
    }

    function setWheelPosition(wheelId, value) {
        const wheel = document.getElementById(wheelId);
        const items = wheel.querySelectorAll('.wheel-item');
        items.forEach((item, index) => {
            if (item.dataset.val === value) {
                wheel.scrollTop = index * 40;
            }
        });
        updateWheelHighlight(wheelId);
    }

    function updateWheelHighlight(wheelId) {
        const wheel = document.getElementById(wheelId);
        const index = Math.round(wheel.scrollTop / 40);
        const items = wheel.querySelectorAll('.wheel-item');
        items.forEach((item, i) => {
            if (i === index) item.classList.add('selected');
            else item.classList.remove('selected');
        });
    }

    function getSelectedWheelValue(wheelId) {
        const wheel = document.getElementById(wheelId);
        const index = Math.round(wheel.scrollTop / 40);
        const items = wheel.querySelectorAll('.wheel-item');
        return items[index] ? items[index].dataset.val : items[0].dataset.val;
    }

    function confirmTime() {
        let ampm, hour, minute;

        if (isKeypadOpen) {
            ampm = keypadAmpm.value;
            hour = parseInt(keypadHour.value);
            minute = parseInt(keypadMinute.value);
            if (isNaN(hour) || hour < 1 || hour > 12) hour = 12;
            if (isNaN(minute) || minute < 0 || minute > 59) minute = 0;
        } else {
            ampm = getSelectedWheelValue('ampmWheel');
            hour = parseInt(getSelectedWheelValue('hourWheel'));
            minute = parseInt(getSelectedWheelValue('minuteWheel'));
        }

        let h24 = hour;
        if (ampm === '오후' && h24 < 12) h24 += 12;
        if (ampm === '오전' && h24 === 12) h24 = 0;

        const timeStr = String(h24).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
        const displayStr = `${ampm} ${hour}:${String(minute).padStart(2, '0')}`;

        if (activeTarget === 'start') {
            startTimeValue = timeStr;
            startTimeDisplay.innerText = displayStr;
            startTimeDisplay.classList.add('active');
        } else {
            endTimeValue = timeStr;
            endTimeDisplay.innerText = displayStr;
            endTimeDisplay.classList.add('active');
        }
        closeModal();
    }

    function setNow(target) {
        if (target === 'start' && getOngoingRecord()) return;

        const now = new Date();
        const h24 = now.getHours();
        const m = now.getMinutes();
        const timeStr = String(h24).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        
        let ampm = h24 >= 12 ? '오후' : '오전';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        let mStr = String(m).padStart(2, '0');

        if (target === 'start') {
            startTimeValue = timeStr;
            startTimeDisplay.innerText = `${ampm} ${h12}:${mStr}`;
            startTimeDisplay.classList.add('active');
        } else {
            endTimeValue = timeStr;
            endTimeDisplay.innerText = `${ampm} ${h12}:${mStr}`;
            endTimeDisplay.classList.add('active');
        }
    }

    function getOngoingRecord() {
        const selectedDate = document.getElementById('recordDate').value;
        return records.find(item => item.date === selectedDate && item.duration === null);
    }

    function handleSubmit() {
        const selectedDate = document.getElementById('recordDate').value;
        if (!selectedDate) { alert('날짜를 선택해주세요.'); return; }

        const ongoing = getOngoingRecord();

        if (ongoing) {
            if (!endTimeValue) { alert('진행 중인 기록의 종료 시간을 입력해주세요.'); return; }
            const duration = timeToMinutes(endTimeValue) - timeToMinutes(ongoing.start);
            if (duration < 0) { alert('종료 시간이 시작 시간보다 빠를 수 없습니다.'); return; }

            ongoing.end = endTimeValue;
            ongoing.duration = duration;
            localStorage.setItem('timeRecords', JSON.stringify(records));
            resetInputs();
            updateDisplay();
        } else {
            if (!startTimeValue) { alert('시작 시간을 입력해주세요.'); return; }
            let duration = null;
            if (endTimeValue) {
                duration = timeToMinutes(endTimeValue) - timeToMinutes(startTimeValue);
                if (duration < 0) { alert('종료 시간이 시작 시간보다 빠를 수 없습니다.'); return; }
            }
            records.push({ id: Date.now(), date: selectedDate, start: startTimeValue, end: endTimeValue || null, duration });
            localStorage.setItem('timeRecords', JSON.stringify(records));
            resetInputs();
            updateDisplay();
        }
    }

    function resetInputs() {
        startTimeValue = ""; endTimeValue = "";
        startTimeDisplay.innerText = "시간 선택"; startTimeDisplay.classList.remove('active');
        endTimeDisplay.innerText = "미입력 가능"; endTimeDisplay.classList.remove('active');
    }

    function timeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function minutesToHoursMinutes(totalMinutes) {
        return `${Math.floor(totalMinutes / 60)}시간 ${totalMinutes % 60}분`;
    }

    function formatDisplayTime(timeStr) {
        if (!timeStr) return '';
        const [h24, m] = timeStr.split(':').map(Number);
        let ampm = h24 >= 12 ? '오후' : '오전';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        return `${ampm} ${h12}:${String(m).padStart(2, '0')}`;
    }

    function deleteRecord(id) {
        records = records.filter(item => item.id !== id);
        localStorage.setItem('timeRecords', JSON.stringify(records));
        updateDisplay();
    }

    function updateDisplay() {
        const selectedDate = document.getElementById('recordDate').value;
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        let dailyTotalMinutes = 0;
        records.filter(item => item.date === selectedDate).forEach(item => {
            if (item.duration !== null) dailyTotalMinutes += item.duration;
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-info">
                    <span class="history-time">${formatDisplayTime(item.start)} ~ ${item.end ? formatDisplayTime(item.end) : '진행 중'}</span>
                    <span class="${item.duration !== null ? 'history-duration' : 'history-duration ongoing'}">${item.duration !== null ? `(${minutesToHoursMinutes(item.duration)})` : '🔴 기록 중 (종료 시간 필요)'}</span>
                </div>
                <button class="delete-btn" onclick="deleteRecord(${item.id})">✕</button>
            `;
            historyList.appendChild(div);
        });

        document.getElementById('dailyTotal').innerText = minutesToHoursMinutes(dailyTotalMinutes);

        const ongoing = getOngoingRecord();
        if (ongoing) {
            startTimeValue = ongoing.start;
            startTimeDisplay.innerText = formatDisplayTime(ongoing.start) + " (진행중)";
            startTimeDisplay.classList.add('disabled');
            startNowBtn.style.display = 'none';
            startLabel.innerText = "2. 진행 중인 시작 시간 (수정 불가)";
            mainSubmitBtn.innerText = "종료 시간 기록하기 (완료)";
            mainSubmitBtn.classList.add('ongoing-mode');
        } else {
            startTimeDisplay.classList.remove('disabled');
            startNowBtn.style.display = 'block';
            startLabel.innerText = "2. 시작 시간";
            mainSubmitBtn.innerText = "기록 추가하기";
            mainSubmitBtn.classList.remove('ongoing-mode');
            if (!startTimeValue) startTimeDisplay.innerText = "시간 선택";
        }
    }

    document.getElementById('recordDate').addEventListener('change', updateDisplay);
    updateDisplay();
</script>

</body>
</html>
